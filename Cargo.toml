[package]
name = "ragu"
version.workspace = true
authors.workspace = true
description = "Proof-carrying data (PCD) framework for Rust"
license.workspace = true
edition.workspace = true
rust-version.workspace = true

readme = "README.md"
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/ragu"
categories = ["cryptography", "mathematics", "algorithms", "science", "no-std"]
keywords = ["cryptography", "zero-knowledge", "proof-carrying-data", "pcd", "recursion"]

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "katex-header.html"]
all-features = true

[features]
default = ["multicore"]
# Embeds the Pasta generators derived at build time; see `pasta`.
baked = ["ragu_pcd/baked"]
multicore = [
  "ragu_acceleration/multicore",
  "ragu_circuits/multicore",
  "ragu_core/multicore",
  "ragu_pcd/multicore",
]
std = [
  "ragu_acceleration/std",
  "ragu_circuits/std",
  "ragu_core/std",
  "ragu_pcd/std",
  "ragu_primitives/std",
]
# Exposes `Application::verify_uncompressed` as a test oracle. Production
# verification goes through `Application::verify_compressed`.
test-utils = ["ragu_pcd/test-utils"]

[lib]
bench = false

[dependencies]
ragu_acceleration = { path = "crates/ragu_acceleration", version = "0.0.0", default-features = false }
ragu_core = { path = "crates/ragu_core", version = "0.0.0", default-features = false, features = ["alloc"] }
ragu_circuits = { path = "crates/ragu_circuits", version = "0.0.0", default-features = false, features = ["alloc"] }
ragu_primitives = { path = "crates/ragu_primitives", version = "0.0.0", default-features = false, features = ["alloc"] }
ragu_pcd = { path = "crates/ragu_pcd", version = "0.0.0", default-features = false, features = ["alloc"] }

[workspace]
members = [
  "crates/ragu_acceleration",
  "crates/ragu_backend",
  "crates/ragu_circuits",
  "crates/ragu_core",
  "crates/ragu_gadgets",
  "crates/ragu_macros",
  "crates/ragu_primitives",
  "crates/ragu_pcd",
  "crates/ragu_testing",
  "qa/fv/extraction",
  "qa/no_std",
]

resolver = "2"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"

# `just test`: release settings, but incremental and with more codegen units,
# and `ragu_pcd`, whose lib test target dominates rebuilds, at opt-level 1. A
# one-line edit in `ragu_pcd` then rebuilds in about a minute rather than five,
# and the tests run about as fast as under `--release`.
[profile.fast-test]
inherits = "release"
incremental = true
codegen-units = 256

[profile.fast-test.package.ragu_pcd]
opt-level = 1

[workspace.package]
version = "0.0.0"
authors = ["Sean Bowe <ewillbefull@gmail.com>"]
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.97"
homepage = "https://github.com/tachyon-zcash/ragu"
repository = "https://github.com/tachyon-zcash/ragu"

[workspace.dependencies]
# Keep rand in sync with the isolated qa/fuzz workspace.
rand = { version = "0.10", default-features = false, features = ["std_rng"] }
lazy_static = "1.5.0"
proptest = "1.11.0"
gungraun = "0.20.0"
blake2b_simd = { version = "1.0", default-features = false }
# Used only by ragu_pcd's generator build script.
pasta_curves = { package = "zakura-pasta-curves", version = "1.1.0", default-features = false, features = ["alloc"] }
maybe-rayon = { package = "tachyon-maybe-rayon", version = "0.1.2", default-features = false }
rayon = "1.11.0"
# Bento stores the generated Udon points.
bento = { package = "zakura-bento", version = "0.1.0", default-features = false }
# Udon supplies the Pasta fields, curves, generic arithmetic traits, cycle, and
# Poseidon parameters.
udon = { package = "zakura-udon", version = "0.2.0", default-features = false, features = ["traits", "poseidon"] }
criterion = { version = "0.8", default-features = false }

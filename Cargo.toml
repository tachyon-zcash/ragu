[package]
name = "ragu"
version.workspace = true
authors.workspace = true
description = "Proof-carrying data (PCD) framework for Rust"
license.workspace = true
edition.workspace = true
rust-version.workspace = true

readme = "README.md"
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/ragu"
categories = ["cryptography", "mathematics", "algorithms", "science", "no-std"]
keywords = ["cryptography", "zero-knowledge", "proof-carrying-data", "pcd", "recursion"]

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "katex-header.html"]
all-features = true

[features]
default = ["multicore"]
# Opt-in API-level mock of `ragu_pcd` (see the crate docs). Off by default.
mock = [
  "dep:blake2b_simd",
  "dep:udon",
  "dep:ragu_core",
  "dep:ragu_primitives",
  "dep:ragu_circuits",
  "dep:rand",
]
# Kept for compatibility: the mock has no parallel stage of its own.
multicore = []
std = []

[lib]
bench = false

# mock dependencies (pulled in only by the `mock` feature). The mock defines
# only what a consumer cannot import from a real Ragu crate, so this list is
# limited to the crates its own signatures name. Consumers depend on
# `ragu_circuits`, `ragu_primitives` and the rest directly.
[dependencies]
blake2b_simd = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
udon = { workspace = true, optional = true }
ragu_core = { path = "crates/ragu_core", version = "0.0.0", default-features = false, features = ["alloc"], optional = true }
ragu_primitives = { path = "crates/ragu_primitives", version = "0.0.0", default-features = false, features = ["alloc"], optional = true }
ragu_circuits = { path = "crates/ragu_circuits", version = "0.0.0", default-features = false, features = ["alloc"], optional = true }

[workspace]
members = [
  "crates/ragu_acceleration",
  "crates/ragu_backend",
  "crates/ragu_circuits",
  "crates/ragu_core",
  "crates/ragu_gadgets",
  "crates/ragu_macros",
  "crates/ragu_primitives",
  "crates/ragu_pcd",
  "crates/ragu_testing",
  "qa/ceremony",
  "qa/fv/extraction",
  "qa/no_std",
]

resolver = "2"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"

[workspace.package]
version = "0.0.0"
authors = ["Sean Bowe <ewillbefull@gmail.com>"]
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.97"
homepage = "https://github.com/tachyon-zcash/ragu"
repository = "https://github.com/tachyon-zcash/ragu"

[workspace.dependencies]
# Keep rand in sync with the isolated qa/fuzz workspace.
rand = { version = "0.10", default-features = false, features = ["std_rng"] }
lazy_static = "1.5.0"
proptest = "1.11.0"
gungraun = "0.17.0"
blake2b_simd = { version = "1.0", default-features = false }
# Used only by ragu_pcd's generator build script.
pasta_curves = { package = "zakura-pasta-curves", version = "1.1.0", default-features = false, features = ["alloc"] }
maybe-rayon = { package = "tachyon-maybe-rayon", version = "0.1.2", default-features = false }
rayon = "1.11.0"
# Bento stores the generated Udon points.
bento = { package = "zakura-bento", version = "0.1.0", default-features = false }
# Udon supplies the Pasta fields, curves, generic arithmetic traits, cycle, and
# Poseidon parameters.
udon = { package = "zakura-udon", version = "0.1.0", default-features = false, features = ["traits", "poseidon"] }
criterion = { version = "0.5", default-features = false }

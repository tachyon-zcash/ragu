# Apply only to ragu_pcd's production library with --no-deps. The backend
# defaults and test oracles intentionally call the underlying arithmetic.
# Clippy resolves the crate's canonical name, not the `udon` dependency alias.
disallowed-methods = [
  { path = "ragu_core::for_each_mut", reason = "Route PCD independent work through the selected Backend::for_each_mut" },
  { path = "ragu_core::join", reason = "Route PCD independent jobs through the selected Backend::join" },
  { path = "ragu_core::msm", reason = "Route PCD MSMs through the selected Backend::msm" },
  { path = "ragu_core::msm_batch", reason = "Route PCD MSM batches through the selected Backend::msm_batch" },
  { path = "ragu_core::msm_many", reason = "Use Backend::msm_batch or Backend::sparse_commit_many_to_affine for PCD batches" },
  { path = "ragu_core::PreparedMsm::new", reason = "Prepare IPA bases through the selected Backend::prepare_msm" },
  { path = "ragu_core::PreparedMsm::evaluate", reason = "Evaluate prepared MSMs through the selected Backend::msm_prepared" },
  { path = "ragu_core::PreparedMsm::evaluate_with_workspace", reason = "Evaluate prepared MSMs through the selected Backend::msm_prepared" },
  { path = "ragu_core::PreparedMsm::with_table", reason = "Prepare commitment tables through the selected Backend::prepare_commitments" },
  { path = "ragu_core::PreparedMsm::evaluate_many_indexed", reason = "Commit with prepared bases through the selected Backend::sparse_commit_prepared" },
  { path = "zakura_udon::curve::Affine::msm", reason = "Route PCD MSMs through the selected Backend::msm" },
  { path = "ragu_circuits::polynomials::sparse::Polynomial::commit", reason = "Use the selected Backend::sparse_commit" },
  { path = "ragu_circuits::polynomials::sparse::Polynomial::commit_to_affine", reason = "Use the selected Backend::sparse_commit_to_affine" },
  { path = "ragu_circuits::polynomials::sparse::Polynomial::linear_combination_parallel", reason = "Use the selected Backend::sparse_linear_combination" },
  { path = "ragu_circuits::registry::Registry::wxy_over_domain_parallel", reason = "Use the selected Backend::registry_wxy_over_domain" },
  { path = "ragu_circuits::registry::Registry::circuits_xy_parallel", reason = "Use the selected Backend::registry_circuits_xy" },
  { path = "ragu_circuits::registry::RegistryAt::x_parallel", reason = "Use the selected Backend::registry_at_x" },
  { path = "ragu_circuits::registry::RegistryAt::y_parallel", reason = "Use the selected Backend::registry_at_y" },
  { path = "ragu_circuits::registry::RegistryAt::xy_parallel", reason = "Use the selected Backend::registry_wxy" },
  { path = "ragu_backend::RegistryEvaluation::wxy_parallel", reason = "Use the selected Backend::registry_wxy" },
  { path = "ragu_core::fft", reason = "Route PCD FFTs through the selected Backend::fft" },
  { path = "ragu_core::ifft", reason = "Route PCD inverse FFTs through the selected Backend::ifft" },
  { path = "zakura_udon::field::Field::fft", reason = "Route PCD FFTs through the selected Backend::fft" },
  { path = "zakura_udon::field::Field::ifft", reason = "Route PCD inverse FFTs through the selected Backend::ifft" },
  { path = "zakura_udon::fft::Domain::transform", reason = "Route PCD FFTs through the selected Backend::fft" },
  { path = "zakura_udon::fft::Domain::inverse_transform", reason = "Route PCD inverse FFTs through the selected Backend::ifft" },
]

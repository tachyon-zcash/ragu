[package]
name = "ragu_ceremony"
version.workspace = true
authors.workspace = true
description = "Derives Ragu registry tags from recorded ceremony inputs"
license.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "registry_tags"
path = "registry_tags.rs"

[dependencies]
udon = { workspace = true }
ragu_core = { path = "../../crates/ragu_core", version = "0.0.0" }
ragu_pcd = { path = "../../crates/ragu_pcd", version = "0.0.0", features = ["baked", "unstable-aggregator"] }

[package]
name = "ragu_circuits"
version.workspace = true
authors.workspace = true
description = "Traits and utilities for reducing arithmetic-circuit constraints to polynomials; intended for internal use in the Ragu project"
license.workspace = true
edition.workspace = true
rust-version.workspace = true

readme = "README.md"
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/ragu_circuits"
categories = ["cryptography", "mathematics", "algorithms", "science", "no-std"]
keywords = ["cryptography", "zero-knowledge", "circuits", "polynomials", "pcd"]

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "katex-header.html"]
all-features = true

[features]
alloc = []
default = ["alloc"]
multicore = ["maybe-rayon/threads", "ragu_core/multicore", "std"]
std = ["ragu_core/std"]
test-utils = []
# Fixed fallback registry tag for tests, benchmarks, and fuzzing. Never enable in production.
insecure-test-registry-tag = []

[lib]
bench = false

[dependencies]
udon = { workspace = true }
blake2b_simd = { workspace = true }
ragu_core = { path = "../ragu_core", version = "0.0.0", default-features = false, features = ["alloc"] }
rand = { workspace = true }
ragu_primitives = { path = "../ragu_primitives", version = "0.0.0", default-features = false, features = ["alloc"] }
maybe-rayon = { workspace = true }

[dev-dependencies]
rand = { workspace = true, features = ["thread_rng"] }
proptest = { workspace = true }
gungraun = { workspace = true }
criterion = { workspace = true }
ragu_pcd = { path = "../ragu_pcd", version = "0.0.0", default-features = false, features = ["baked"] }
ragu_testing = { path = "../ragu_testing", version = "0.0.0" }

[[bench]]
name = "gungraun"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "criterion_trace"
path = "benches/criterion/trace.rs"
harness = false

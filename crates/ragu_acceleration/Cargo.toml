[package]
name = "ragu_acceleration"
version.workspace = true
authors.workspace = true
description = "Hardware acceleration for the Ragu project"
license.workspace = true
edition.workspace = true
rust-version.workspace = true

readme = "README.md"
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/ragu_acceleration"
categories = ["cryptography", "mathematics", "algorithms", "development-tools", "no-std"]
keywords = ["cryptography", "zero-knowledge", "acceleration", "circuits", "pcd"]

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "katex-header.html"]

[features]
default = []
multicore = ["ragu_backend/multicore", "ragu_core/multicore", "std"]
std = ["ragu_backend/std", "ragu_core/std"]

[lib]
bench = false

[dependencies]
udon = { workspace = true }
ragu_backend = { path = "../ragu_backend", version = "0.0.0", default-features = false }
ragu_core = { path = "../ragu_core", version = "0.0.0", default-features = false, features = ["alloc"] }

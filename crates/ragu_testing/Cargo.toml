[package]
name = "ragu_testing"
version.workspace = true
authors.workspace = true
description = "Test fixtures intended for internal use in the Ragu project"
license.workspace = true
edition.workspace = true
rust-version.workspace = true

readme = "README.md"
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/ragu_testing"
categories = [
  "cryptography",
  "mathematics",
  "algorithms",
  "development-tools",
]
keywords = ["cryptography", "zero-knowledge", "testing", "pcd"]

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "katex-header.html"]

[features]
default = []

[lib]
bench = false

[dependencies]
ragu_arithmetic = { path = "../ragu_arithmetic", version = "0.0.0", default-features = false, features = ["alloc"] }
ragu_circuits = { path = "../ragu_circuits", version = "0.0.0", default-features = false, features = ["alloc"] }
ragu_core = { path = "../ragu_core", version = "0.0.0", default-features = false, features = ["alloc"] }
ragu_pcd = { path = "../ragu_pcd", version = "0.0.0", default-features = false, features = ["alloc"] }
ragu_primitives = { path = "../ragu_primitives", version = "0.0.0", default-features = false, features = ["alloc"] }
proptest = { workspace = true }

[dev-dependencies]
ragu_pasta = { path = "../ragu_pasta", version = "0.0.0", default-features = false, features = ["alloc", "baked"] }

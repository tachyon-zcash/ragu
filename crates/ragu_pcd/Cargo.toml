[package]
name = "ragu_pcd"
version.workspace = true
authors.workspace = true
description = "Top-level API for building proof-carrying data (PCD) applications for the Ragu project"
license.workspace = true
edition.workspace = true
rust-version.workspace = true
# Some files in tests/ are unit-test modules that need private library access.
# Register integration targets explicitly instead of treating every file as one.
autotests = false

readme = "README.md"
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/ragu_pcd"
categories = [
  "cryptography",
  "mathematics",
  "algorithms",
  "development-tools",
  "no-std",
]
keywords = ["cryptography", "zero-knowledge", "proof-carrying-data", "pcd", "recursion"]

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "katex-header.html"]
all-features = true

[features]
alloc = []
# Embeds the Pasta generators derived at build time; see `pasta`.
baked = ["alloc", "dep:bento", "dep:lazy_static"]
# Additional, separately loaded generators for Aggregator extensions above R<13>.
baked-aggregator = ["baked"]
default = ["alloc"]
multicore = ["maybe-rayon/threads", "ragu_acceleration/multicore", "ragu_backend/multicore", "ragu_circuits/multicore", "std"]
std = ["alloc", "ragu_core/std"]
# `serde::{Serialize, Deserialize}` for `MinimalProof`, as its wire bytes.
serde = ["dep:serde"]
# Exposes `Application::verify_uncompressed` as a test oracle for the crate's
# own tests, benchmarks and the fuzz harness. Production verification goes
# through `Application::verify_compressed`.
test-utils = []
# Exposes the hidden `fuzzing` module — proof corruption and the patcher seam
# over the internal recursion circuits — used by the fuzz harness and the
# crate's own tests. Not part of the stable public API. Its corruptions are
# judged by the uncompressed verifier, so it needs `test-utils`.
unstable-fuzzing = ["test-utils"]

[build-dependencies]
# Retain the original hash-to-curve implementation for generator derivation.
pasta_curves = { workspace = true }
bento = { workspace = true }
udon = { workspace = true }

[lib]
bench = false

[dependencies]
blake2b_simd = { workspace = true }
ragu_acceleration = { path = "../ragu_acceleration", version = "0.0.0", default-features = false }
udon = { workspace = true }
bento = { workspace = true, optional = true }
# Baked parameters must also initialize on targets without std.
lazy_static = { workspace = true, optional = true, features = ["spin_no_std"] }
ragu_backend = { path = "../ragu_backend", version = "0.0.0", default-features = false }
maybe-rayon = { workspace = true }
ragu_circuits = { path = "../ragu_circuits", version = "0.0.0", default-features = false, features = ["alloc"] }
ragu_core = { path = "../ragu_core", version = "0.0.0", default-features = false, features = ["alloc"] }
rand = { workspace = true }
ragu_primitives = { path = "../ragu_primitives", version = "0.0.0", default-features = false, features = ["alloc"] }
serde = { version = "1", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
serde_json = "1"
rand = { workspace = true, features = ["thread_rng"] }
criterion = { workspace = true }
ragu_circuits = { path = "../ragu_circuits", version = "0.0.0", default-features = false, features = ["alloc", "test-utils"] }
# Extension tests also need the optional larger Aggregator parameters, and the
# integration tests and benchmarks check proofs with the uncompressed verifier.
ragu_pcd = { path = ".", version = "0.0.0", default-features = false, features = ["baked-aggregator", "test-utils"] }
gungraun = { workspace = true }
ragu_testing = { path = "../ragu_testing", version = "0.0.0" }
proptest = { workspace = true }
# Parallel test cases also exercise the prover without its multicore feature.
rayon = { workspace = true }

[[bench]]
name = "gungraun"
harness = false

[[bench]]
name = "criterion_fuse"
path = "benches/criterion/fuse.rs"
harness = false
required-features = ["multicore"]

[[bench]]
name = "criterion_registry"
path = "benches/criterion/registry.rs"
harness = false

[[bench]]
name = "criterion_verify"
path = "benches/criterion/verify.rs"
harness = false

[[bench]]
name = "criterion_compress"
path = "benches/criterion/compress.rs"
harness = false
required-features = ["multicore"]

[[test]]
name = "corruption"
required-features = ["unstable-fuzzing"]

[[test]]
name = "nontrivial"

[[test]]
name = "pasta_parameters"

[[test]]
name = "profiles"

[[test]]
name = "registration_errors"

[[test]]
name = "registry_tags"

[[test]]
name = "rerandomization"

[[test]]
name = "wire"

[[test]]
name = "serde"
required-features = ["serde"]

[[test]]
name = "compressed_wire"

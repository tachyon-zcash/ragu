name: Rust Setup
description: Install pinned Rust toolchain, cache Cargo artifacts, and print versions
inputs:
  components:
    description: Optional Rust components to install (comma-separated)
    required: false
    default: ""
  targets:
    description: Additional targets to install
    required: false
    default: ""
  apt-packages:
    description: Additional apt packages to install (space-separated)
    required: false
    default: ""
  cargo-tools:
    description: Cargo tools to install
    required: false
    default: ""
  cache-suffix:
    description: Optional suffix to differentiate cache keys between jobs
    required: false
    default: ""
  save-dependencies:
    description: Allow this job to populate its dependency cache on main
    required: false
    default: "true"
  cache-compiler:
    description: Use sccache for a non-incremental Linux build
    required: false
    default: "false"
  cache-pcd-incremental:
    description: Cache PCD compiler state for a native release build
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install additional packages
      if: runner.os == 'Linux' && inputs.apt-packages
      shell: bash
      env:
        APT_PACKAGES: ${{ inputs.apt-packages }}
      run: |
        sudo apt-get update
        # word-splitting is intentional: callers pass a space-separated list
        # shellcheck disable=SC2086
        sudo apt-get install -y $APT_PACKAGES

    # Read channel/components/targets from rust-toolchain.toml and merge with
    # the composite's own inputs. dtolnay's master action does not read
    # rust-toolchain.toml itself (only the version-named branches do, via
    # a hardcoded `env: toolchain:` in their own action.yml), so we extract
    # the channel here and pass it explicitly. Audit this composite and
    # `rust-nightly-setup/action.yml` together when rotating the dtolnay SHA.
    - name: Read rust-toolchain.toml
      id: toolchain-config
      shell: bash
      env:
        EXTRA_COMPONENTS: ${{ inputs.components }}
        EXTRA_TARGETS: ${{ inputs.targets }}
      run: |
        python3 - <<'PY'
        import os
        import sys
        import tomllib

        with open("rust-toolchain.toml", "rb") as f:
            cfg = tomllib.load(f).get("toolchain", {})

        channel = cfg.get("channel")
        if not channel:
            print("::error file=rust-toolchain.toml::missing toolchain.channel", file=sys.stderr)
            sys.exit(1)

        def merge(file_vals, env_var):
            extra = os.environ.get(env_var, "").split(",")
            seen = set()
            out = []
            for raw in list(file_vals or []) + extra:
                v = raw.strip()
                if v and v not in seen:
                    seen.add(v)
                    out.append(v)
            return ",".join(out)

        components = merge(cfg.get("components"), "EXTRA_COMPONENTS")
        targets = merge(cfg.get("targets"), "EXTRA_TARGETS")

        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8", newline="\n") as out:
            out.write(f"channel={channel}\n")
            out.write(f"components={components}\n")
            out.write(f"targets={targets}\n")
        PY

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master @ 2026-05-23
      with:
        toolchain: ${{ steps.toolchain-config.outputs.channel }}
        components: ${{ steps.toolchain-config.outputs.components }}
        targets: ${{ steps.toolchain-config.outputs.targets }}

    # The action caches dependency artifacts and sets CARGO_INCREMENTAL=0.
    # Only main populates these caches for its matching PR jobs.
    - name: Restore Cargo dependencies
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: ${{ inputs.cache-suffix || github.job }}
        cache-bin: false
        save-if: ${{ github.ref == 'refs/heads/main' && inputs.save-dependencies == 'true' }}

    - name: Configure compiler cache
      if: runner.os == 'Linux' && inputs.cache-compiler == 'true' && inputs.cache-pcd-incremental != 'true'
      shell: bash
      env:
        CACHE_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
        # proc-macro-crate reads Cargo manifests during macro expansion.
        MANIFEST_HASH: ${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}
      run: |
        {
          echo 'SCCACHE_GHA_ENABLED=true'
          echo "SCCACHE_GHA_RW_MODE=$CACHE_MODE"
          echo "SCCACHE_GHA_VERSION=$MANIFEST_HASH"
        } >> "$GITHUB_ENV"
    - name: Install compiler cache
      if: runner.os == 'Linux' && inputs.cache-compiler == 'true' && inputs.cache-pcd-incremental != 'true'
      id: sccache
      continue-on-error: true
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: v0.19.0
    - name: Enable compiler cache
      if: steps.sccache.outcome == 'success'
      shell: bash
      run: |
        {
          echo 'CARGO_INCREMENTAL=0'
          echo 'RUSTC_WRAPPER=sccache'
        } >> "$GITHUB_ENV"

    # Limit new snapshots for a configuration to once a week per ref.
    # PRs can share main's snapshot for the same week.
    - name: Select PCD compiler cache week
      if: inputs.cache-pcd-incremental == 'true'
      id: pcd-cache-week
      shell: bash
      run: printf 'week=%s\n' "$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

    # Restore PCD compiler state after rust-cache restores the dependencies.
    # Callers unset CARGO_INCREMENTAL for the build to use the package profile.
    - name: Cache PCD incremental compiler state
      if: inputs.cache-pcd-incremental == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target/release/incremental/ragu_pcd-*
        key: pcd-incremental-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-suffix }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', '.github/actions/rust-setup/ci-release*.toml') }}-${{ steps.pcd-cache-week.outputs.week }}
        restore-keys: |
          pcd-incremental-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-suffix }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', '.github/actions/rust-setup/ci-release*.toml') }}-

    - name: Install cargo tools
      if: inputs.cargo-tools != ''
      uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
      with:
        tool: ${{ inputs.cargo-tools }}

    - name: Show toolchain
      shell: bash
      run: rustc -Vv && cargo -Vv

name: Backend checks
on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs when a new commit is pushed to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Extend this shared matrix when another accelerated backend lands instead
  # of adding a feature-specific matrix (and three more PR status checks).
  # The general Rust jobs exercise all features together; this checks each
  # backend's distinct feature configuration and end-to-end boundary.
  backend-equivalence:
    name: backend equivalence (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: ./.github/actions/rust-setup
        with:
          components: clippy
          cache-suffix: backend-equivalence
      - name: Run acceleration backend clippy
        if: matrix.os == 'ubuntu-latest'
        run: >-
          cargo clippy -p ragu_acceleration --lib --tests --no-default-features
          --features native-msm -- -D warnings
      - name: Run PCD backend clippy
        if: matrix.os == 'ubuntu-latest'
        run: >-
          cargo clippy -p ragu_pcd --lib --tests --benches --no-default-features
          --features native-msm -- -D warnings
      - name: Run acceleration backend equivalence suite
        run: >-
          cargo test --release -p ragu_acceleration --no-default-features
          --features native-msm -- --test-threads=1
      - name: Run native PCD backend equivalence
        if: matrix.os == 'ubuntu-latest'
        env:
          # Each case builds three applications and runs seed/seed/fuse/verify.
          PROPTEST_CASES: "4"
        run: >-
          cargo test --release -p ragu_pcd --no-default-features --features native-msm
          --lib backend_equivalence:: -- --test-threads=1

  # Every backend must retain its correctness-first fallback on bare metal.
  backend-nostd:
    name: backend no_std
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: ./.github/actions/rust-setup
        with:
          targets: thumbv7em-none-eabihf
          cache-suffix: backend-nostd
      - name: Build backend fallbacks for bare-metal no_std
        run: >-
          cargo build -p ragu_backend -p ragu_acceleration --lib
          --no-default-features --target thumbv7em-none-eabihf
      - name: Build PCD reference configuration for bare-metal no_std
        run: >-
          cargo build -p ragu_pcd --lib --no-default-features --features alloc
          --target thumbv7em-none-eabihf

  # Stable status for the ruleset. Future backend jobs should be added to this
  # list instead of becoming separate required checks.
  backend-required:
    name: backend-required
    if: always()
    needs:
      - backend-equivalence
      - backend-nostd
    runs-on: ubuntu-latest
    steps:
      - name: Validate required backend jobs
        env:
          EQUIVALENCE_RESULT: ${{ needs.backend-equivalence.result }}
          NOSTD_RESULT: ${{ needs.backend-nostd.result }}
        run: |
          if [[ "$EQUIVALENCE_RESULT" != "success" ||
                "$NOSTD_RESULT" != "success" ]]; then
            echo "Backend equivalence: $EQUIVALENCE_RESULT"
            echo "Backend no_std: $NOSTD_RESULT"
            exit 1
          fi

name: Backend CI
on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs when a new commit is pushed to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  changes:
    name: detect backend changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - '.cargo/**'
              - 'crates/**'
              - 'qa/no_std/**'
              - '**/*.rs'
              - '**/*.proptest-regressions'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/fixtures.yml'
              - '.github/workflows/backend.yml'
              - '.github/actions/**'

  fixtures:
    name: fuse fixtures
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
    uses: $/.github/workflows/fixtures.yml

  # Extend this shared matrix when another accelerated backend lands instead
  # of adding a feature-specific matrix (and three more PR status checks).
  # The general Rust jobs exercise all features together; this checks each
  # backend's distinct feature configuration and end-to-end boundary.
  backend-equivalence:
    name: backend equivalence (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: $/.github/actions/rust-setup
        with:
          components: clippy
          cache-suffix: backend-equivalence
          cache-pcd-incremental: ${{ runner.os == 'macOS' || runner.os == 'Windows' }}
      - name: Run acceleration backend clippy
        if: matrix.os == 'ubuntu-latest'
        run: >-
          cargo clippy -p ragu_acceleration --lib --tests --no-default-features
          -- -D warnings
      - name: Run PCD backend clippy
        if: matrix.os == 'ubuntu-latest'
        run: >-
          cargo clippy -p ragu_pcd --lib --tests --benches --no-default-features
          --test online_fp_oracles -- -D warnings
      - name: Run native PCD backend equivalence
        shell: bash
        env:
          # Each case builds three applications and exercises both proof formats.
          PROPTEST_CASES: "4"
          RAGU_PCD_TARGETED_TESTS: "1"
          # Keep the Rust module filter intact when Git Bash launches Cargo.
          MSYS2_ARG_CONV_EXCL: 'backend_equivalence::'
        run: >-
          ${{ runner.os != 'Linux' && 'env -u CARGO_INCREMENTAL' || '' }}
          cargo test --release -p ragu_pcd --no-default-features
          --config .github/actions/rust-setup/ci-release.toml
          ${{ runner.os == 'macOS' && '--config .github/actions/rust-setup/ci-release-macos.toml' || '' }}
          ${{ runner.os == 'Windows' && '--config .github/actions/rust-setup/ci-release-windows.toml' || '' }}
          --lib backend_equivalence:: -- --test-threads=1
      - name: Enforce PCD MSM and FFT backend routing
        if: matrix.os == 'ubuntu-latest'
        env:
          CLIPPY_CONF_DIR: qa/backend
        run: >-
          cargo clippy -p ragu_pcd --lib --no-deps --all-features
          -- -D clippy::disallowed_methods

  # Every backend must retain its correctness-first fallback on bare metal.
  backend-nostd:
    name: backend no_std
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: $/.github/actions/rust-setup
        with:
          targets: thumbv7em-none-eabihf
          cache-suffix: backend-nostd
      - name: Build backend fallbacks for bare-metal no_std
        run: >-
          cargo build -p ragu_backend -p ragu_acceleration --lib
          --no-default-features --target thumbv7em-none-eabihf
      - name: Build PCD reference configuration for bare-metal no_std
        run: >-
          cargo build -p ragu_pcd --lib --no-default-features --features alloc
          --target thumbv7em-none-eabihf
      - name: Build a no_std consumer that depends only on ragu
        run: >-
          cargo build -p ragu_no_std --lib --no-default-features --locked
          --target thumbv7em-none-eabihf

  # Stable status for the ruleset, including the golden fixture replay.
  # Future backend jobs should be added to this list instead of becoming
  # separate required checks.
  backend-required:
    name: backend-required
    if: always()
    needs:
      - changes
      - fixtures
      - backend-equivalence
      - backend-nostd
    runs-on: ubuntu-latest
    steps:
      - name: Validate required backend jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_BACKEND: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'push' }}
          FIXTURES_RESULT: ${{ needs.fixtures.result }}
          EQUIVALENCE_RESULT: ${{ needs.backend-equivalence.result }}
          NOSTD_RESULT: ${{ needs.backend-nostd.result }}
        run: |
          expected=skipped
          if [[ "$RUN_BACKEND" == true ]]; then
            expected=success
          fi
          if [[ "$CHANGES_RESULT" != "success" ||
                "$FIXTURES_RESULT" != "$expected" ||
                "$EQUIVALENCE_RESULT" != "$expected" ||
                "$NOSTD_RESULT" != "$expected" ]]; then
            echo "Backend change detection: $CHANGES_RESULT"
            echo "Fuse fixtures: $FIXTURES_RESULT"
            echo "Backend equivalence: $EQUIVALENCE_RESULT"
            echo "Backend no_std: $NOSTD_RESULT"
            exit 1
          fi

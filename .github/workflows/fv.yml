name: Formal Verification CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs when a new commit is pushed to the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      fv: ${{ steps.filter.outputs.fv }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            fv:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'rust-toolchain.toml'
              - 'qa/fv/**'
              - 'scripts/check_fv_endpoint_census.sh'
              - 'scripts/check_fv_contract_composition.sh'
              - '.github/workflows/fv.yml'
              - '.github/actions/**'

  fv:
    name: exporter + lean
    needs: changes
    if: needs.changes.outputs.fv == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: $/.github/actions/rust-setup
        with:
          cache-suffix: lean-extraction

      - name: Test FV extraction evaluators
        run: cargo test --locked -p lean_extraction

      - name: Check exported Lean files are up to date
        run: cargo run --locked -p lean_extraction -- check

      - name: Check FV trust-boundary census coverage
        run: scripts/check_fv_endpoint_census.sh

      - name: Check FV contract composition boundary
        run: scripts/check_fv_contract_composition.sh

      # We install elan + invoke `lake` directly instead of using
      # `leanprover/lean-action`: that composite transitively references
      # `actions/cache/{restore,save}@v5` (unpinned tags), which the org's
      # required-full-SHA-pinning policy rejects at job setup.
      - name: Cache Lake build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: qa/fv/.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('qa/fv/lean-toolchain') }}-${{ hashFiles('qa/fv/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('qa/fv/lean-toolchain') }}-${{ hashFiles('qa/fv/lake-manifest.json') }}-
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('qa/fv/lean-toolchain') }}-

      # elan is pinned to a release and checked against its sha256; bump the
      # two together. elan then fetches the Lean toolchain named in
      # `qa/fv/lean-toolchain` by tag, without a hash.
      - name: Install elan (Lean toolchain manager)
        shell: bash
        env:
          ELAN_VERSION: v4.2.4
          ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL -o elan.tar.gz \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ELAN_SHA256}  elan.tar.gz" | sha256sum -c -
          tar -xzf elan.tar.gz elan-init
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build Lean project
        shell: bash
        working-directory: qa/fv
        run: lake build --wfail

      # The vk-style equivalence check tying the Lean reimplementations to the
      # Rust circuits: compare the canonical trace digests computed by the Rust
      # extractor against the ones computed in Lean from the reimplementations.
      # `lean --run` interprets the entry point against the oleans built above,
      # avoiding the native-code build that `lake exe` would trigger.
      - name: Fingerprint equivalence check
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked -p lean_extraction -- fingerprint \
            | sort > "$RUNNER_TEMP/fingerprints-rust.txt"
          (cd qa/fv && lake env lean --run Ragu/Fingerprint/Main.lean) \
            | sort > "$RUNNER_TEMP/fingerprints-lean.txt"
          diff -u "$RUNNER_TEMP/fingerprints-rust.txt" "$RUNNER_TEMP/fingerprints-lean.txt"
          echo "all fingerprints match"

      # This is the stronger gadget-level binding. Both implementations receive
      # the same fresh seed but independently run their circuit model and derive
      # domain-separated field challenges from it. Printing the non-secret seed
      # makes a failed run exactly reproducible.
      - name: Fresh randomized polynomial equivalence check
        shell: bash
        run: |
          set -euo pipefail
          seed="$(openssl rand -hex 32)"
          if [[ ! "$seed" =~ ^[0-9a-f]{64}$ ]]; then
            echo "failed to generate a 32-byte polynomial fingerprint seed" >&2
            exit 1
          fi
          echo "polynomial fingerprint seed: $seed"
          cargo run --locked -p lean_extraction -- polynomial-fingerprint \
            --seed "$seed" --points 2 \
            | sort > "$RUNNER_TEMP/polynomial-fingerprints-rust.txt"
          (cd qa/fv && lake env lean --run Ragu/PolynomialFingerprint/Main.lean "$seed" 2) \
            | sort > "$RUNNER_TEMP/polynomial-fingerprints-lean.txt"
          diff -u \
            "$RUNNER_TEMP/polynomial-fingerprints-rust.txt" \
            "$RUNNER_TEMP/polynomial-fingerprints-lean.txt"
          echo "all randomized polynomial fingerprints match"

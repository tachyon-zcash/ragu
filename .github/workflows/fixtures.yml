name: Fixtures

# Checks the golden fixtures under `crates/ragu_pcd/tests/fixtures/`. The
# `fuse fixtures` job runs the prover on the fixtures' seeded randomness tapes
# and requires the committed proofs and digests back, and checks that
# the verifier still accepts the committed compressed proofs. A red job means
# the fuse pipeline or the verifier changed what it produces or accepts; see
# `crates/ragu_pcd/tests/fixtures/fuse/README.md` for how to regenerate the
# fixtures when that is intended.
#
# Backend CI calls this workflow and includes its result in the required
# `backend-required` gate. The Rust CI matrix also runs these tests on every
# platform.

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  fuse:
    name: fuse fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: $/.github/actions/rust-setup
        with:
          cache-suffix: release
          ci-release-profile: true
          save-dependencies: false
          # The runner has repeatedly shut down while compiling the fixture
          # target through sccache. Build this target directly.
          cache-compiler: false
      - name: Check the fuse and verifier fixtures
        env:
          RAGU_FIXTURES: check
          RAGU_PCD_TARGETED_TESTS: "1"
        # Release profiles can enable debug assertions, marking these tests ignored.
        run: >-
          cargo test --release -p ragu_pcd --locked --all-features
          --config .github/actions/rust-setup/ci-release.toml
          --lib proof::fuse_fixture_tests -- --include-ignored

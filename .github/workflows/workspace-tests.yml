name: Workspace tests

on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      features:
        type: string
        required: true
      pcd-suite:
        type: string
        default: full

permissions:
  contents: read

env:
  NEXTEST_TOOL: cargo-nextest@0.9.151
  PCD_UNIT_FILTER: binary_id(=ragu_pcd)

jobs:
  build:
    name: build test archives
    runs-on: ${{ inputs.os }}
    outputs:
      pcd-artifact-id: ${{ steps.pcd-artifact.outputs.artifact-id }}
      workspace-artifact-id: ${{ steps.workspace-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: $/.github/actions/rust-setup
        with:
          cache-suffix: ${{ inputs.pcd-suite != 'full' && format('release-{0}', inputs.pcd-suite) || (inputs.features == 'all' && 'release' || 'release-default-feature') }}
          cache-pcd-incremental: ${{ runner.os == 'macOS' }}
          cargo-tools: ${{ env.NEXTEST_TOOL }}
      - name: Compile and archive test binaries
        shell: bash
        env:
          TEST_FEATURES: ${{ inputs.features }}
          PCD_TEST_SUITE: ${{ inputs.pcd-suite }}
        run: |
          profiles=.github/actions/rust-setup
          cargo_args=(--workspace --release --locked --config "$profiles/ci-release.toml")
          if [[ "$RUNNER_OS" == macOS ]]; then
            unset CARGO_INCREMENTAL
            cargo_args+=(--config "$profiles/ci-release-macos.toml")
          fi
          case "$TEST_FEATURES" in
            all) cargo_args+=(--all-features) ;;
            default) ;;
            *) exit 1 ;;
          esac
          case "$PCD_TEST_SUITE" in
            regular|proofs) cargo_args+=(--config "$profiles/ci-release-pcd-$PCD_TEST_SUITE.toml") ;;
            full) ;;
            *) exit 1 ;;
          esac
          if [[ "$PCD_TEST_SUITE" == proofs ]]; then
            # Keep the workspace library feature resolution for the proof binary.
            cargo_args+=(--lib)
          fi

          cargo nextest archive "${cargo_args[@]}" -E "$PCD_UNIT_FILTER" \
            --archive-file "$RUNNER_TEMP/pcd-unit-tests.tar.zst"
          if [[ "$PCD_TEST_SUITE" != proofs ]]; then
            # Reuse the build above and keep each download limited to its suite.
            cargo nextest archive "${cargo_args[@]}" -E "!$PCD_UNIT_FILTER" \
              --archive-file "$RUNNER_TEMP/workspace-tests.tar.zst"
            # Reuse the compiled libraries on this runner for Cargo doctests.
            # ragu_no_std sets doctest = false in its manifest.
            cargo test "${cargo_args[@]}" --doc --exclude ragu_no_std
          fi
      - id: pcd-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pcd-unit-tests-${{ inputs.os }}-${{ inputs.features }}-${{ inputs.pcd-suite }}
          path: ${{ runner.temp }}/pcd-unit-tests.tar.zst
          compression-level: 0
          if-no-files-found: error
          overwrite: true
      - id: workspace-artifact
        if: inputs.pcd-suite != 'proofs'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workspace-tests-${{ inputs.os }}-${{ inputs.features }}-${{ inputs.pcd-suite }}
          path: ${{ runner.temp }}/workspace-tests.tar.zst
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  workspace:
    name: workspace unit and integration tests
    needs: build
    if: inputs.pcd-suite != 'proofs'
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: ${{ env.NEXTEST_TOOL }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # An empty ID asks the action to download all artifacts.
          artifact-ids: ${{ needs.build.outputs.workspace-artifact-id || 'missing workspace artifact ID' }}
          path: ${{ runner.temp }}
      - name: Run workspace tests from archive
        shell: bash
        run: |
          cargo-nextest nextest run --archive-file "$RUNNER_TEMP/workspace-tests.tar.zst" \
            --workspace-remap "$GITHUB_WORKSPACE" --no-fail-fast --no-tests=fail

  pcd:
    name: PCD unit tests (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    needs: build
    runs-on: ${{ inputs.os }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.pcd-suite == 'full' && '[1, 2, 3]' || '[1, 2]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: ${{ env.NEXTEST_TOOL }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # An empty ID asks the action to download all artifacts.
          artifact-ids: ${{ needs.build.outputs.pcd-artifact-id || 'missing PCD artifact ID' }}
          path: ${{ runner.temp }}
      - name: Run PCD unit-test shard
        shell: bash
        env:
          # Git Bash can interpret Rust module paths in the filter as a path list.
          MSYS2_ARG_CONV_EXCL: '--filterset='
          PCD_SHARD: ${{ matrix.shard }}
          PCD_SHARDS: ${{ strategy.job-total }}
          PCD_TEST_SUITE: ${{ inputs.pcd-suite }}
        run: |
          proof_tests='test(/^(online_batch_tests::|proof::fuse_fixture_tests::|proof::profile_substitution_tests::)/)'
          filter="$PCD_UNIT_FILTER"
          case "$PCD_TEST_SUITE" in
            regular) filter="$filter & !$proof_tests" ;;
            proofs)
              filter="$filter & $proof_tests"
              export RAGU_PCD_STANDARD_SENDER="$RUNNER_TEMP/ragu-standard-sender.bin"
              ;;
          esac
          cargo-nextest nextest run --archive-file "$RUNNER_TEMP/pcd-unit-tests.tar.zst" \
            --workspace-remap "$GITHUB_WORKSPACE" --filterset="$filter" \
            --partition "slice:$PCD_SHARD/$PCD_SHARDS" --no-fail-fast --no-tests=fail

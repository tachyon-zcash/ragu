name: Lint
# The Poseidon tables live in the `udon` dependency, so a manifest or lockfile
# bump can change them without touching a `.rs` file here.
on:
  push:
    branches: [main]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'qa/params/**'
      - '.github/workflows/lint.yml'
      - '.github/actions/**'
  pull_request:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'qa/params/**'
      - '.github/workflows/lint.yml'
      - '.github/actions/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Enforce use of Bound<'dr, D, K> alias instead of verbose GadgetKind::Rebind patterns
  bound-alias:
    name: bound alias check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for verbose GadgetKind::Rebind patterns
        run: |
          # Check for UFCS patterns like <K as GadgetKind<...>>::Rebind
          # Allowed: gadgets.rs (defines Bound alias and trait)
          if grep -rn --include='*.rs' 'as GadgetKind.*>::Rebind' . | grep -v 'crates/ragu_core/src/gadgets.rs'; then
            echo "::error::Found verbose GadgetKind::Rebind UFCS pattern. Use Bound<'dr, D, K> alias instead."
            exit 1
          fi

  # Regenerate the Poseidon round constants and MDS matrices from the Grain
  # LFSR and fail if the pinned tables differ. The permutation and every proof
  # over it are generic in the parameters; the golden fixtures notice a changed
  # table, but only this check says whether the new one is right.
  poseidon-params:
    name: poseidon parameter provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: ./.github/actions/rust-setup
        with:
          cache-suffix: poseidon-provenance
      - name: Regenerate and compare
        run: python3 qa/params/check_poseidon_params.py

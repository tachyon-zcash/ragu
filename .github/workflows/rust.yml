name: Rust CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      full-suite:
        description: Run all jobs regardless of changed paths
        type: boolean
        default: false

# Cancel in-progress runs when a new commit is pushed to the same branch/PR
concurrency:
  group: Rust CI-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Detect which files changed to conditionally run jobs
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.full.outputs.enabled || steps.filter.outputs.rust }}
      fuzz: ${{ steps.full.outputs.enabled || steps.filter.outputs.fuzz }}
      book: ${{ steps.full.outputs.enabled || steps.filter.outputs.book }}
    steps:
      - name: Enable all jobs for the full suite
        id: full
        if: inputs.full-suite
        run: echo 'enabled=true' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !inputs.full-suite }}
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: ${{ !inputs.full-suite }}
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/*.proptest-regressions'
              - 'crates/ragu_pcd/tests/**'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain.toml'
              - '.github/workflows/rust.yml'
              - '.github/actions/**'
            fuzz:
              - 'qa/fuzz/**'
              - '.github/workflows/fuzz-cron.yml'
              - '.github/workflows/fuzz-coverage.yml'
            book:
              - 'book/**'

  fmt:
    name: rustfmt (nightly)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned nightly rustfmt
        id: nightly
        uses: $/.github/actions/rust-nightly-setup
        with:
          components: rustfmt

      - name: Check formatting
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.nightly.outputs.toolchain }}
        run: cargo fmt --all -- --config-path rustfmt.nightly.toml --check

  clippy:
    name: clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: $/.github/actions/rust-setup
        with:
          components: clippy
      - name: Run clippy
        env:
          RAGU_PCD_NIGHTLY_TESTS: "1"
        # Cargo's --tests selection omits targets declared with test = false.
        run: |
          cargo clippy --workspace --lib --tests --benches --locked --all-features -- -D warnings
          cargo clippy --workspace --locked --all-features --test corruption --test online_fp_oracles -- -D warnings
      # Workspace builds turn on `test-utils` through `ragu_pcd`'s dev-dependency
      # on itself, so only a library-only pass sees the production configuration
      # and flags code that only the uncompressed test oracle still uses.
      - name: Run clippy (ragu_pcd without test-utils)
        run: |
          cargo clippy -p ragu_pcd --lib --locked -- -D warnings
          cargo clippy -p ragu_pcd --lib --locked --features baked,multicore -- -D warnings

  proptests-fast:
    name: proptests (fast)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: $/.github/actions/rust-setup
        with:
          cache-suffix: proptests-fast
      - name: Run fast proptests
        run: cargo test --release -p ragu_core --locked --all-features proptest
        env:
          PROPTEST_CASES: "64"

  test-corruption:
    name: corruption (exhaustive)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: $/.github/actions/rust-setup
        with:
          cache-suffix: release
          ci-release-profile: true
          save-dependencies: false
          # Built through sccache, the runner shuts down while compiling the
          # PCD unit-test target with the decompression tests; the same build
          # passes without it.
          cache-compiler: false
      # Compile and run the corruption suite, including the rejection sweeps
      # and controls.
      - name: Run exhaustive corruption coverage
        run: >-
          cargo test --release -p ragu_pcd --locked --all-features
          --config .github/actions/rust-setup/ci-release.toml
          --test corruption -- --include-ignored
      # Compile and run the production-rank online Fp oracle suite.
      - name: Run the online Fp oracle suite
        run: >-
          cargo test --release -p ragu_pcd --locked --all-features
          --config .github/actions/rust-setup/ci-release.toml
          --test online_fp_oracles -- --include-ignored
      # Replay the saved recursion failures on PRs as well as in heavy-tests.
      # One fresh case follows the committed seeds in each property. Backend
      # equivalence runs its properties in backend.yml.
      - name: Replay recursive regression seeds
        env:
          PROPTEST_CASES: "1"
        run: >-
          cargo test --release -p ragu_pcd --locked --all-features --lib
          --jobs 1
          --config .github/actions/rust-setup/ci-release.toml
          -- --ignored --test-threads=1
          proof::recursive_boundary_tests::stages::same_lift_bit_substitutions_reject_through_two_generations
          proof::recursive_boundary_tests::stages::corrupted_hoisted_products_reject_through_two_generations
          proof::recursive_binding_tests::challenge_binding::partial_and_pre_beta_substitutions_reject_through_two_generations

  test-debug-assertions:
    name: debug regressions (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: $/.github/actions/rust-setup
        with:
          cache-suffix: debug-assertions
      - name: Run PCD debug regressions
        # Optimize production-rank proofs while exercising debug-only checks.
        env:
          CARGO_PROFILE_TEST_OPT_LEVEL: "3"
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
          RAGU_PCD_TARGETED_TESTS: "1"
        run: cargo test -p ragu_pcd --lib --locked --all-features proof::child_commitment_tests

  test-default-feature:
    name: default-feature (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: $/.github/actions/rust-setup
        with:
          cache-suffix: release-default-feature
          ci-release-profile: true
          # Built through sccache, the runner shuts down while compiling the
          # PCD unit-test target with the decompression tests; the same build
          # passes without it.
          cache-compiler: false
      # Compiling the PCD unit tests alongside the paging integration tests
      # exceeds the runner's memory. Build the unit tests first.
      - name: Build unit tests (default features)
        run: >-
          cargo test --release --all --locked --lib --no-run --timings --jobs 1
          --config .github/actions/rust-setup/ci-release.toml
      - name: Run tests (default features)
        run: >-
          cargo test --release --all --locked
          --config .github/actions/rust-setup/ci-release.toml

  test-all-feature:
    name: all-feature (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: $/.github/actions/rust-setup
        with:
          cache-suffix: release
          ci-release-profile: true
          # Built through sccache, the runner shuts down while compiling the
          # PCD unit-test target with the decompression tests; the same build
          # passes without it.
          cache-compiler: false
          cache-pcd-incremental: ${{ runner.os == 'macOS' || runner.os == 'Windows' }}
      - name: Build tests (all features)
        shell: bash
        run: >-
          ${{ runner.os != 'Linux' && 'env -u CARGO_INCREMENTAL' || '' }}
          cargo test --release --all --locked --all-features --no-run --timings
          ${{ runner.os == 'Linux' && '--lib --jobs 1' || '' }}
          --config .github/actions/rust-setup/ci-release.toml
          ${{ runner.os == 'macOS' && '--config .github/actions/rust-setup/ci-release-macos.toml' || '' }}
          ${{ runner.os == 'Windows' && '--config .github/actions/rust-setup/ci-release-windows.toml' || '' }}
      - name: Run tests (all features)
        shell: bash
        run: >-
          ${{ runner.os != 'Linux' && 'env -u CARGO_INCREMENTAL' || '' }}
          cargo test --release --all --locked --all-features
          --config .github/actions/rust-setup/ci-release.toml
          ${{ runner.os == 'macOS' && '--config .github/actions/rust-setup/ci-release-macos.toml' || '' }}
          ${{ runner.os == 'Windows' && '--config .github/actions/rust-setup/ci-release-windows.toml' || '' }}

  bitrot:
    name: bitrot check
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: $/.github/actions/rust-setup
        with:
          cache-suffix: all-features
      - name: Build benchmarks and examples
        run: cargo build --workspace --benches --examples --all-features

  fuzz-check:
    name: fuzz harness check (nightly)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.fuzz == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned nightly toolchain
        id: nightly
        uses: $/.github/actions/rust-nightly-setup

      - name: Cache fuzz target directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: qa/fuzz/target
          key: ${{ runner.os }}-fuzz-target-${{ hashFiles('qa/fuzz/Cargo.toml') }}-${{ hashFiles('qa/fuzz/fuzz_targets/**/*.rs') }}-${{ hashFiles('qa/fuzz/bin/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-fuzz-target-

      # Cheap and build-free, so it runs before the compile: every target
      # must be listed in fuzz.sh and in both workflow matrices, and must have
      # committed seeds. A target missing from the cron matrix is simply never
      # fuzzed, and one with no seeds makes the coverage workflow report
      # "no inputs" — which used to be a green result.
      - name: Fuzz target census
        run: qa/fuzz/check_targets.sh

      # `--locked` on every cargo call in this workspace: `qa/fuzz` has its
      # own Cargo.lock, and until now the cron's `circuit_lint --locked` was
      # the only strict reader of it. A dependency added to a workspace crate
      # without regenerating that lock passed PR CI and then failed every
      # scheduled campaign at the lint step (#887).
      - name: Test fuzz support library
        working-directory: qa/fuzz
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.nightly.outputs.toolchain }}
        run: cargo test --locked --lib

      # These ignored library tests include the fixed mutation sweeps and
      # bounded generated cases. Execute them here on every Rust/fuzz PR.
      - name: Test internal patcher (default features)
        working-directory: qa/fuzz
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.nightly.outputs.toolchain }}
          PROPTEST_CASES: "2"
        run: cargo test --release --locked --lib internal_patcher::tests -- --include-ignored

      - name: Test internal patcher (all features)
        working-directory: qa/fuzz
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.nightly.outputs.toolchain }}
          PROPTEST_CASES: "2"
        run: cargo test --release --locked --all-features --lib internal_patcher::tests -- --include-ignored

      - name: Exercise both proof wire fuzz paths
        timeout-minutes: 15
        working-directory: qa/fuzz
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.nightly.outputs.toolchain }}
        run: |
          cargo test --release --locked --lib proof_wire::tests::decode_to_verify_smoke -- --ignored --exact
          # Execute the actual libFuzzer entry points too, on the control
          # inputs that select the unchanged seed and a canonical scalar
          # replacement. Fixed-file replay needs no coverage build.
          inputs=$(mktemp -d)
          printf '\001' > "$inputs/valid"
          printf '\005' > "$inputs/scalar"
          for target in fuzz_proof_wire fuzz_compressed_wire; do
            cargo run --release --locked --bin "$target" -- "$inputs"/* -timeout=180 -rss_limit_mb=4096
          done

      - name: Check all fuzz targets
        working-directory: qa/fuzz
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.nightly.outputs.toolchain }}
        run: cargo check --locked --bins

  docs:
    name: docs
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: $/.github/actions/rust-setup
        with:
          cache-suffix: docs
      - name: Check intra-doc links
        run: cargo doc --no-deps --all --locked --all-features --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"
      # The website documents each package on its own with default features,
      # where a link into a feature-gated module does not resolve.
      - name: Check intra-doc links per package with default features
        run: |
          for pkg in $(cargo metadata --format-version=1 --no-deps --locked | jq -r '.packages[].name'); do
            cargo doc --no-deps --locked --document-private-items -p "$pkg"
          done
        env:
          RUSTDOCFLAGS: "-D warnings"

  book:
    name: ragu book
    needs: changes
    if: needs.changes.outputs.book == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: $/.github/actions/rust-setup
      - name: Install mdbook and plugins
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: mdbook@0.4.52,mdbook-katex@0.9.4,mdbook-mermaid@0.16.2,mdbook-admonish@1.20.0
      - name: Build book
        run: mdbook build ./book

  # Aggregate gate: a single, stable required status check. It always runs —
  # even on non-Rust PRs where every job below is skipped. Full-suite runs
  # require all jobs to succeed, including jobs gated by paths on PRs.
  # Require THIS in the ruleset instead of the individual job names: a skipped
  # matrix job reports its un-expanded name, so its per-platform checks
  # never report and block lean-/docs-only PRs.
  ci-required:
    name: ci-required
    if: always()
    needs:
      - changes
      - fmt
      - clippy
      - proptests-fast
      - test-debug-assertions
      - test-default-feature
      - test-all-feature
      - test-corruption
      - bitrot
      - fuzz-check
      - docs
      - book
    runs-on: ubuntu-latest
    steps:
      - name: Report unsuccessful required jobs
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          (inputs.full-suite && contains(needs.*.result, 'skipped'))
        # Pass the expansion through `env` rather than interpolating `${{ }}`
        # directly into `run:`, which zizmor's template-injection audit flags.
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "A required job did not succeed."
          echo "$NEEDS_JSON"
          exit 1

name: Notify website to deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    if: github.repository == 'tachyon-zcash/ragu' && github.ref == 'refs/heads/main'
    # REPO_DISPATCH_TOKEN lives in this environment, whose deployment-branch
    # policy admits only `main`, so no other branch's workflow can read it.
    environment: website-dispatch
    steps:
      - name: Trigger repository_dispatch in website
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.REPO_DISPATCH_TOKEN }}
          repository: tachyon-zcash/website
          event-type: ragu_updated
          client-payload: |
            { "ragu_sha": "${{ github.sha }}" }

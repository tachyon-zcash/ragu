name: Heavy tests

# Build the all-feature workspace test targets once and run every ignored
# test at eight cases per property. Rust CI selects the opt-out integration
# targets (corruption and online_fp_oracles) in its exhaustive job.

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  NEXTEST_TOOL: cargo-nextest@0.9.151

permissions:
  contents: read

jobs:
  build:
    name: Build test archive
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: $/.github/actions/rust-setup
        with:
          cache-suffix: heavy-tests
          cargo-tools: ${{ env.NEXTEST_TOOL }}
      - name: Build and archive the workspace tests
        shell: bash
        env:
          RAGU_PCD_NIGHTLY_TESTS: '1'
        run: >-
          cargo nextest archive --release --locked --workspace --all-features --tests
          --archive-file "$RUNNER_TEMP/heavy-tests.tar.zst"
      - name: Upload the test archive
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: heavy-tests-${{ github.run_attempt }}
          path: ${{ runner.temp }}/heavy-tests.tar.zst
          if-no-files-found: error
          compression-level: 0
          # Keep the archive available for GitHub's 30-day rerun window.
          retention-days: 30

  ignored:
    name: Ignored tests (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: ${{ env.NEXTEST_TOOL }}
      - name: Download the test archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id || 'missing heavy test artifact ID' }}
          path: ${{ runner.temp }}
      - name: Run an ignored-test partition
        shell: bash
        env:
          PARTITION: slice:${{ matrix.shard }}/${{ strategy.job-total }}
          PROPTEST_CASES: "8"
        run: >-
          cargo-nextest nextest run --archive-file "$RUNNER_TEMP/heavy-tests.tar.zst"
          --workspace-remap "$GITHUB_WORKSPACE" --partition "$PARTITION"
          --ignore-default-filter --no-fail-fast --no-tests fail -- --ignored

name: Workflow audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'qa/audit/**'
      - '.claude/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'qa/audit/**'
      - '.claude/**'

  workflow_call:

concurrency:
  group: Workflow audit-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned CLI and sandbox for the local API test
        run: bash qa/audit/install.sh
      - run: python3 -m unittest discover -s qa/audit -p 'test_*.py' -v
        env:
          RAGU_AUDIT_NATIVE_TEST: '1'

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          annotations: true
          # Catch all findings, including `informational`. Known-safe
          # patterns must be silenced via line-level
          # `# zizmor: ignore[<rule>]` comments at the site, not by
          # raising the threshold globally — otherwise a new template
          # injection or unpinned use slips in silently with future
          # workflow edits.
          min-severity: informational

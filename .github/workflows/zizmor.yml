name: Workflow audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'qa/audit/**'
      - '.claude/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'qa/audit/**'
      - '.claude/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install the pinned CLI and sandbox for the local API test
        run: bash qa/audit/install.sh
      - run: python3 -m unittest discover -s qa/audit -p 'test_*.py' -v
        env:
          RAGU_AUDIT_NATIVE_TEST: '1'

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6
        with:
          advanced-security: false
          annotations: true
          # Catch all findings, including `informational`. Known-safe
          # patterns must be silenced via line-level
          # `# zizmor: ignore[<rule>]` comments at the site, not by
          # raising the threshold globally — otherwise a new template
          # injection or unpinned use slips in silently with future
          # workflow edits.
          min-severity: informational
